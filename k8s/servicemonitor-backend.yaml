apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: fruit-backend-monitor
    namespace: monitoring
    labels:
        release: kps
spec:
    selector:
        matchLabels:
            app: fruit-backend-svc
    namespaceSelector:
        matchNames:
            - default
    endpoints:
        - port: http
          path: /metrics
          interval: 10s
